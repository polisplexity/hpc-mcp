name: Inventory metadata

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/validate_inventory.py
      - run: python cases/cimat-guanajuato/run_cpu_pilot.py
      - run: python -m pip install -r cases/cimat-guanajuato/requirements-mcp.txt
      - run: python cases/cimat-guanajuato/check_fixture_mcp.py
      - run: python -m tools.check_portable_job
      - name: Verify recorded Hermes Agent receipt
        run: |
          folder=cases/portable-python/evidence
          evidence="$folder/hermes-agent-20261123.json"
          request_id=$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["verified"]["request_id"])' "$evidence")
          python -m tools.verify_agent_receipt --trace "$folder/hermes-agent-mcp-20261123.jsonl" \
            --answer "$evidence" --request-id "$request_id"
          if python -m tools.verify_agent_receipt --trace /dev/null --answer "$evidence" --request-id "$request_id"; then
            echo "A claimed success without tool evidence passed verification" >&2
            exit 1
          fi
      - name: Verify recorded Hermes MPI cancellation
        run: |
          stem=cases/mpi-copper/evidence/cimat-hermes-mpi-cancel-20261124
          python -m tools.verify_agent_cancel --trace "$stem.jsonl" --answer "$stem.json" --run "$stem.json"
      - name: Verify recorded Hermes copper temperature sweep
        run: |
          stem=cases/mpi-copper/evidence/cimat-hermes-copper-sweep-20261124
          python -m tools.verify_agent_copper_sweep --trace "$stem.jsonl" --answer "$stem.json" --record "$stem.json"
      - name: Verify recorded Hermes SSH environment and batch
        run: |
          python -m tools.run_hermes_environment --verify-only \
            --output cases/ssh-environment/evidence/cimat-hermes-20261124
      - name: Verify recorded Hermes R execution and environment reuse
        run: |
          python -m tools.run_hermes_r --verify-only \
            --output cases/ssh-r-environment/evidence/cimat-hermes-20261124
      - name: Verify recorded Hermes node data and persistent R artifact
        run: |
          python -m tools.run_hermes_r_storage --verify-only \
            --output cases/ssh-r-environment/evidence/cimat-storage-20261124
